# Despertador de GlobalRide
# Abre la app cada 4 horas con un navegador para que Streamlit Cloud no la duerma.
# Si la encuentra dormida, da clic en el botón para despertarla.
# También se puede correr a mano: GitHub → Actions → "Despertador GlobalRide" → Run workflow.

name: Despertador GlobalRide

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

env:
  APP_URL: https://globalride-ags.streamlit.app/

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Visitar la app
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              nav = p.chromium.launch()
              pag = nav.new_page()
              pag.goto(url, wait_until="domcontentloaded", timeout=120_000)
              pag.wait_for_timeout(15_000)
              boton = pag.get_by_role("button", name="Yes, get this app back up")
              if boton.count() > 0:
                  print("La app estaba dormida: despertándola...")
                  boton.first.click()
                  pag.wait_for_timeout(90_000)
              else:
                  print("La app está despierta.")
              print("Título:", pag.title())
              nav.close()
